<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Quiz App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      padding: 28px;
    }
    h1 {
      font-size: 22px;
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .progress {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .question {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .option {
      display: block;
      width: 100%;
      text-align: left;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option:hover { border-color: #93c5fd; background: #eff6ff; }
    .option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; font-weight: 600; }
    .option.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .option:disabled { cursor: default; }
    .feedback {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      min-height: 22px;
    }
    .next-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .next-btn:hover { background: #1d4ed8; }
    .result { text-align: center; }
    .result .score { font-size: 48px; font-weight: 700; color: #2563eb; margin: 12px 0; }
    .restart {
      margin-top: 20px;
      padding: 14px 28px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .restart:hover { background: #15803d; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">

    <div id="quizScreen">
      <h1>📘 MCQ Quiz</h1>
      <p class="subtitle">හරි පිළිතුර තෝරන්න</p>
      <p class="progress" id="progress"></p>
      <p class="question" id="question"></p>
      <div id="options"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next-btn" id="nextBtn">ඊළඟ ප්‍රශ්නය →</button>
    </div>

    <div id="resultScreen" class="hidden result">
      <h1>🎉 අවසන්!</h1>
      <p class="subtitle">ඔබේ ලකුණු</p>
      <p class="score" id="scoreText"></p>
      <button class="restart" onclick="restartQuiz()">නැවත උත්සාහ කරන්න</button>
    </div>

  </div>

  <script>
    const questions = [
      {
        q: "ශ්‍රී ලංකාවේ අගනුවර කුමක්ද?",
        options: ["මහනුවර", "කොළඹ", "ශ්‍රී ජයවර්ධනපුර කෝට්ටේ", "ගාල්ල"],
        answer: 2
      },
      {
        q: "2 + 2 × 3 = ?",
        options: ["12", "8", "6", "10"],
        answer: 1
      },
      {
        q: "ජලයේ රසායනික සූත්‍රය කුමක්ද?",
        options: ["CO₂", "H₂O", "O₂", "NaCl"],
        answer: 1
      },
      {
        q: "ශ්‍රී ලංකාවේ උසම කන්ද කුමක්ද?",
        options: ["පිදුරුතලාගල", "ඇඩම්ස් පීක්", "කිරිගල්පොත්ත", "නමුණුකුල"],
        answer: 0
      },
      {
        q: "පහත ඒවායින් ප්‍රාථමික වර්ණයක් නොවන්නේ කුමක්ද?",
        options: ["රතු", "කොළ", "නිල්", "කහ"],
        answer: 1
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    const progressEl   = document.getElementById('progress');
    const questionEl   = document.getElementById('question');
    const optionsEl    = document.getElementById('options');
    const feedbackEl   = document.getElementById('feedback');
    const nextBtn      = document.getElementById('nextBtn');
    const quizScreen   = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const scoreText    = document.getElementById('scoreText');

    function loadQuestion() {
      answered = false;
      const q = questions[current];

      progressEl.textContent = `ප්‍රශ්නය ${current + 1} / ${questions.length}`;
      questionEl.textContent = q.q;
      feedbackEl.textContent = '';
      nextBtn.style.display = 'none';
      optionsEl.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
        btn.onclick = () => checkAnswer(i);
        optionsEl.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (answered) return;
      answered = true;

      const q = questions[current];
      const buttons = optionsEl.querySelectorAll('.option');

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        if (i === selected && i !== q.answer) btn.classList.add('wrong');
      });

      if (selected === q.answer) {
        score++;
        feedbackEl.textContent = '✅ නිවැරදියි!';
        feedbackEl.style.color = '#16a34a';
      } else {
        feedbackEl.textContent = `❌ වැරදියි. නිවැරදි පිළිතුර: ${q.options[q.answer]}`;
        feedbackEl.style.color = '#dc2626';
      }

      nextBtn.style.display = 'block';
      nextBtn.textContent = (current + 1 === questions.length)
        ? 'ප්‍රතිඵල බලන්න →'
        : 'ඊළඟ ප්‍රශ්නය →';
    }

    nextBtn.onclick = () => {
      current++;
      if (current < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      scoreText.textContent = `${score} / ${questions.length}`;
    }

    function restartQuiz() {
      current = 0;
      score = 0;
      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
